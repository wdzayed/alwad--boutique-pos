<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALWAD BOUTIQUE POS</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f7f7f7;
  color:#555;
}
header{
  background:white;
  padding:24px 18px;
  text-align:center;
  border-bottom:1px solid #e5e5e5;
}
.brand{
  font-size:24px;
  letter-spacing:5px;
  color:#aaa;
}
.subtitle{
  margin-top:6px;
  font-size:13px;
  color:#aaa;
}
main{
  max-width:600px;
  margin:auto;
  padding:18px;
}
.search{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:16px;
  background:white;
  outline:none;
}
.title{
  margin:24px 0 12px;
  font-size:18px;
}
.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.product{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:16px;
  padding:16px;
}
.product-image{
  height:95px;
  border-radius:12px;
  background:#f1f1f1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}
.product h3{
  margin:12px 0 5px;
  font-size:15px;
}
.price{
  color:#888;
  font-weight:600;
}
.add{
  width:100%;
  margin-top:12px;
  padding:10px;
  border:0;
  border-radius:10px;
  background:#aaa;
  color:white;
  font-size:14px;
}
.cart{
  margin-top:22px;
  background:white;
  border:1px solid #e5e5e5;
  border-radius:18px;
  padding:18px;
}
.cart-row{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid #eee;
}
.total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:bold;
  padding:18px 0;
}
.payment{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.payment button{
  padding:12px 5px;
  background:#f3f3f3;
  border:1px solid #ddd;
  border-radius:10px;
}
.checkout{
  width:100%;
  padding:16px;
  margin-top:14px;
  border:0;
  border-radius:12px;
  background:#999;
  color:white;
  font-size:17px;
  font-weight:bold;
}
.empty{
  color:#aaa;
  text-align:center;
  padding:15px;
}
</style>
</head>

<body>

<header>
  <img src="IMG_4197.jpeg" alt="ALWAD BOUTIQUE" style="width:220px;max-width:80%;height:auto;">
  <div class="subtitle">نظام الكاشير</div>
</header>

<main>

<input class="search" id="search" placeholder="بحث عن عطر..." oninput="searchProducts()">

<div class="title">المنتجات</div>

<div class="products" id="products"></div>

<div class="cart">
  <div class="title" style="margin-top:0">سلة المبيعات</div>

  <div id="cart">
    <div class="empty">لم تتم إضافة منتجات بعد</div>
  </div>

  <div class="total">
    <span>الإجمالي</span>
    <span id="total">0 AED</span>
  </div>

  <div class="payment">
    <button onclick="selectPayment('نقد')">نقد</button>
    <button onclick="selectPayment('بطاقة')">بطاقة</button>
    <button onclick="selectPayment('تحويل')">تحويل</button>
  </div>

  <button class="checkout" onclick="checkout()">إتمام البيع</button>
</div>

</main>

<script>
const products = [
 {name:"TIERRA",price:350},
 {name:"AMOR",price:320},
 {name:"NOCHE",price:330},
 {name:"SEDA",price:300}
];

let cart=[];
let payment="";

function renderProducts(list=products){
 const box=document.getElementById("products");
 box.innerHTML="";
 list.forEach(p=>{
   box.innerHTML+=`
   <div class="product">
     <div class="product-image">◈</div>
     <h3>${p.name}</h3>
     <div class="price">${p.price} AED</div>
     <button class="add" onclick="addToCart('${p.name}',${p.price})">
       إضافة للسلة
     </button>
   </div>`;
 });
}

function addToCart(name,price){
 const found=cart.find(x=>x.name===name);
 if(found) found.qty++;
 else cart.push({name,price,qty:1});
 renderCart();
}

function renderCart(){
 const box=document.getElementById("cart");

 if(cart.length===0){
   box.innerHTML='<div class="empty">لم تتم إضافة منتجات بعد</div>';
 }else{
   box.innerHTML="";
   cart.forEach(x=>{
     box.innerHTML+=`
       <div class="cart-row">
         <span>${x.name} × ${x.qty}</span>
         <span>${x.price*x.qty} AED</span>
       </div>`;
   });
 }

 const total=cart.reduce((s,x)=>s+(x.price*x.qty),0);
 document.getElementById("total").innerText=total+" AED";
}

function selectPayment(type){
 payment=type;
 alert("طريقة الدفع: "+type);
}

function checkout(){
 if(cart.length===0){
   alert("أضف منتجاً أولاً");
   return;
 }

 if(!payment){
   alert("اختر طريقة الدفع");
   return;
 }

 alert("تمت عملية البيع بنجاح ✓");
 cart=[];
 payment="";
 renderCart();
}

function searchProducts(){
 const q=document.getElementById("search").value.toLowerCase();
 renderProducts(products.filter(p=>p.name.toLowerCase().includes(q)));
}

renderProducts();
</script>

</body>
</html>
